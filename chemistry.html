<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>化学材料知识库</title>
  <style>
    *{box-sizing:border-box}html{background:#061523}body{margin:0;min-height:100vh;color:#eafcff;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 84% 8%,rgba(16,185,129,.22),transparent 30%),linear-gradient(145deg,#061523,#0a2630 55%,#071521)}
    main{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 64px}.back{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border:1px solid rgba(110,231,183,.5);border-radius:10px;color:#d1fae5;background:#064e3b;text-decoration:none;font-weight:800}.back:hover,.back:focus-visible{background:#047857;outline:3px solid rgba(110,231,183,.25)}
    .hero{margin-top:20px;padding:clamp(26px,5vw,56px);border:1px solid rgba(94,234,212,.35);border-radius:24px;background:linear-gradient(135deg,rgba(6,78,59,.78),rgba(8,47,73,.8));box-shadow:0 24px 70px rgba(0,0,0,.28)}.kicker{color:#6ee7b7;font-weight:900;letter-spacing:.12em}.hero h1{margin:10px 0;font-size:clamp(36px,6vw,64px)}.hero p{max-width:820px;margin:0;color:#c6e5e1;font-size:16px;line-height:1.7}
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0 28px}.steps span{border-top:3px solid #34d399;padding-top:9px;color:#a7f3d0;font-size:13px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    details{border:1px solid rgba(103,232,249,.3);border-radius:18px;background:rgba(5,25,38,.92);overflow:hidden;transition:.16s}details:hover,details[open]{border-color:#34d399;box-shadow:0 10px 30px rgba(0,0,0,.24)}summary{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:92px;padding:20px;cursor:pointer;list-style:none;touch-action:manipulation;user-select:none}summary::-webkit-details-marker{display:none}summary:focus-visible{outline:3px solid #22d3ee;outline-offset:-4px}.number{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;color:#052e2b;background:linear-gradient(135deg,#a7f3d0,#22d3ee);font-weight:950}.title h2{margin:0;font-size:19px}.title p{margin:5px 0 0;color:#b7d6da;font-size:13px}.toggle{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#6ee7b7;background:rgba(16,185,129,.14);font-size:25px}details[open] .toggle{transform:rotate(45deg)}.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 20px 20px 80px}.topic{border-left:3px solid #34d399;padding:12px;background:rgba(13,148,136,.13)}.topic strong{display:block;color:#d1fae5;font-size:14px}.topic span{display:block;margin-top:5px;color:#b5d5d8;font-size:12px;line-height:1.5}
    @media(max-width:760px){main{width:calc(100% - 20px);padding-top:14px}.grid{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.topics{grid-template-columns:1fr;padding-left:20px}.hero{padding:26px 20px}}
  </style>
</head>
<body>
<main>
  <a class="back" href="/data/?v=20260826-2">← 返回材料数据库</a>
  <section class="hero"><div class="kicker">CHEMICAL MATERIALS · KNOWLEDGE PATH</div><h1>化学材料知识库</h1><p>从元素、化学键与结构出发，逐级进入材料制备、表征、性能和前沿功能体系。沿“组成—结构—工艺—性能—应用”的主线学习。</p></section>
  <nav class="steps"><span>01 基础概念</span><span>02 结构组成</span><span>03 方法性能</span><span>04 专业前沿</span></nav>
  <section class="grid" id="grid"></section>
</main>
<script>
const chapters=[
['材料基础分类与概念','建立化学材料的知识坐标',[['物质与材料','纯物质、混合物、相与材料体系'],['分类方法','按组成、结构、来源和用途分类'],['结构—性能关系','从微观结构理解宏观行为']]],
['元素、化合物与结构','从原子尺度认识材料',[['元素与周期律','电子排布、周期趋势和活性'],['化合物与化学式','化学计量、缺陷与非化学计量'],['晶体与分子结构','晶胞、对称性、构型与构象']]],
['化学键与材料组成','连接组成和稳定性的核心',[['离子键与共价键','局域成键、配位与键极性'],['金属键与弱相互作用','电子海、氢键和范德华力'],['组成设计','掺杂、固溶、复合与缺陷工程']]],
['常见材料体系','由经典门类进入真实材料',[['无机材料','陶瓷、玻璃、金属、盐与氧化物'],['有机材料','小分子、液晶、染料与有机半导体'],['高分子材料','热塑性、热固性、弹性体和复合物']]],
['材料性质','理解材料为何表现不同',[['热力学','相平衡、自由能、相图与稳定性'],['动力学','反应速率、扩散、成核与生长'],['电化学','氧化还原、电极、电解质与界面'],['表面与界面','吸附、润湿、界面能和腐蚀']]],
['合成与制备方法','把设计转化为可控样品',[['固相与液相','烧结、溶胶凝胶、水热和沉淀'],['气相与薄膜','CVD、PVD、ALD 和外延生长'],['聚合与加工','聚合、成型与复合'],['绿色与规模化','低能耗、连续化和可持续制备']]],
['结构与成分表征','用证据连接结构与结论',[['物相与结构','XRD、电子衍射与散射'],['形貌与微区','SEM、TEM 与 AFM'],['组成与化学态','光谱、质谱、XPS 与元素分析'],['热与原位表征','DSC/TGA、原位和操作态测试']]],
['性能与应用','从指标走向工程场景',[['力学与热学','强度、韧性、热容与热传导'],['电磁与光学','输运、介电、磁性和光响应'],['耐久与安全','老化、疲劳、腐蚀和失效分析'],['应用匹配','能源、电子、环境、生医与结构件']]],
['进阶专题','面向研究与产业前沿',[['催化材料','活性位、选择性、载体与催化循环'],['电池材料','正负极、电解质、界面膜与衰减'],['半导体材料','能带、载流子、缺陷与器件工艺'],['功能材料','光电、铁电、磁性、智能与响应材料']]]];
document.getElementById('grid').innerHTML=chapters.map((c,i)=>`<details ${i?'':'open'}><summary><span class="number">${String(i+1).padStart(2,'0')}</span><span class="title"><h2>${c[0]}</h2><p>${c[1]}</p></span><span class="toggle">+</span></summary><div class="topics">${c[2].map(t=>`<div class="topic"><strong>${t[0]}</strong><span>${t[1]}</span></div>`).join('')}</div></details>`).join('');
</script>
</body></html>
